<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>some Flowers for You ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffd6e7, #fff0f6);
        }

        /* =========================
           START SCREEN
        ========================= */

        #startScreen {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            cursor: pointer;

            z-index: 10;

            background:
                radial-gradient(circle at top, #fff5fa, #ffd6e7);

            transition: opacity 0.5s ease;
        }

        #startScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .gift {
            font-size: 80px;

            animation: bounce 1.5s infinite;
        }

        #startScreen h1 {
            color: #d63384;

            font-size: clamp(28px, 6vw, 58px);

            margin: 20px 20px 10px;
        }

        #startScreen p {
            color: #8a3158;

            font-size: clamp(18px, 3vw, 28px);
        }

        #startScreen small {
            margin-top: 15px;

            color: #a85c7c;

            animation: blink 1.2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0.3;
            }
        }


        /* =========================
           FLOWER CONTAINER
        ========================= */

        #flowerContainer {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 20;
        }


        /* Individual flowers */

        .flower {
            position: absolute;

            transform: translate(-50%, -50%) scale(0);

            animation: flowerPop 0.35s ease-out forwards;

            user-select: none;

            filter:
                drop-shadow(0 3px 4px rgba(120, 30, 70, 0.18));
        }


        @keyframes flowerPop {

            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0)
                    rotate(-30deg);

                opacity: 0;
            }

            70% {
                transform:
                    translate(-50%, -50%)
                    scale(1.2)
                    rotate(10deg);

                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1)
                    rotate(0deg);

                opacity: 1;
            }
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        #errorScreen {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 100;

            background: rgba(255, 182, 210, 0.25);

            backdrop-filter: blur(3px);
        }


        .errorBox {

            width: min(90%, 520px);

            background: white;

            border-radius: 22px;

            padding: 35px 30px;

            text-align: center;

            box-shadow:
                0 25px 80px rgba(100, 20, 60, 0.35);

            animation: errorPopup 0.6s cubic-bezier(.17,.67,.35,1.3);
        }


        .errorIcon {
            font-size: 55px;
        }


        .errorBox h2 {

            color: #d63384;

            margin: 15px 0;

            font-size: 26px;
        }


        .errorBox p {

            color: #6b4253;

            font-size: 18px;

            line-height: 1.6;

            margin: 10px 0;
        }


        .restart {

            border: none;

            background: #d63384;

            color: white;

            padding: 13px 28px;

            border-radius: 30px;

            font-size: 16px;

            cursor: pointer;

            margin-top: 15px;

            transition: transform 0.2s ease;
        }


        .restart:hover {
            transform: scale(1.08);
        }


        @keyframes errorPopup {

            from {
                transform: scale(0.2) rotate(-5deg);

                opacity: 0;
            }

            to {
                transform: scale(1) rotate(0);

                opacity: 1;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         START SCREEN
    ========================= -->

    <div id="startScreen" onclick="startSurprise()">

        <div class="gift">
            🎁
        </div>

        <h1>
            Mohammad has got some flower for you. 👀
        </h1>

        <p>
            🌸 Look here 🌸
        </p>

        <small>
            Click me...
        </small>

    </div>



    <!-- =========================
         FLOWERS
    ========================= -->

    <div id="flowerContainer"></div>



    <!-- =========================
         FINAL MESSAGE
    ========================= -->

    <div id="errorScreen">

        <div class="errorBox">

            <div class="errorIcon">
                🌸⚠️🌸
            </div>

            <h2>
                Oops! Something went wrong...
            </h2>

            <p>
                There are too many flowers
                that are not enough for your beauty. 😭❤️
            </p>

            <p>
                <strong>
                    System has officially given up.
                </strong>
            </p>

            <button
                class="restart"
                onclick="restart()">

                Try Again 🌸

            </button>

        </div>

    </div>



    <script>

        const flowerContainer =
            document.getElementById("flowerContainer");

        const startScreen =
            document.getElementById("startScreen");

        const errorScreen =
            document.getElementById("errorScreen");


        /*
         * Different flowers.
         * You can add/remove emojis here.
         */

        const flowers = [
            "🌸",
            "🌷",
            "🌺",
            "🌹",
            "💮",
            "🌼",
            "🪷"
        ];


        let flowerTimer;

        let flowerCount = 0;

        let speed = 900;

        let running = false;



        /* =========================
           CREATE ONE FLOWER
        ========================= */

        function createFlower() {

            const flower =
                document.createElement("div");


            flower.className = "flower";


            /*
             * Pick random flower
             */

            flower.innerText =
                flowers[
                    Math.floor(
                        Math.random() * flowers.length
                    )
                ];


            /*
             * Random position
             *
             * Keep flowers slightly inside
             * the edges so they don't get cut off.
             */

            const x =
                3 + Math.random() * 94;

            const y =
                3 + Math.random() * 94;


            flower.style.left =
                x + "vw";

            flower.style.top =
                y + "vh";


            /*
             * Random size
             */

            const size =
                25 + Math.random() * 45;


            flower.style.fontSize =
                size + "px";


            /*
             * Add flower to screen
             */

            flowerContainer.appendChild(
                flower
            );


            flowerCount++;
        }



        /* =========================
           CREATE MULTIPLE FLOWERS
        ========================= */

        function createFlowerBurst(amount) {

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                /*
                 * Tiny delay between each flower
                 * creates the "pop pop pop" effect.
                 */

                setTimeout(
                    createFlower,
                    i * 35
                );

            }

        }



        /* =========================
           FLOWER FLOOD
        ========================= */

        function flowerFlood() {

            if (!running) {
                return;
            }


            /*
             * The longer it runs,
             * the more flowers appear.
             */

            if (flowerCount < 5) {

                createFlowerBurst(1);

            }

            else if (flowerCount < 20) {

                createFlowerBurst(2);

            }

            else if (flowerCount < 50) {

                createFlowerBurst(4);

            }

            else if (flowerCount < 100) {

                createFlowerBurst(7);

            }

            else if (flowerCount < 160) {

                createFlowerBurst(10);

            }

            else {

                /*
                 * FULL FLOWER CHAOS
                 */

                createFlowerBurst(15);
            }


            /*
             * Make the next wave happen faster.
             */

            speed =
                Math.max(
                    80,
                    speed * 0.88
                );


            flowerTimer =
                setTimeout(
                    flowerFlood,
                    speed
                );
        }



        /* =========================
           START SURPRISE
        ========================= */

        function startSurprise() {

            if (running) {
                return;
            }


            running = true;


            /*
             * Hide opening screen.
             */

            startScreen.classList.add(
                "hidden"
            );


            /*
             * FIRST FLOWER
             */

            setTimeout(
                createFlower,
                400
            );


            /*
             * Start gradual flower flood.
             */

            setTimeout(
                flowerFlood,
                1000
            );


            /*
             * After enough flowers have
             * appeared, show the message.
             *
             * Flowers DO NOT disappear.
             */

            setTimeout(
                showError,
                15000
            );
        }



        /* =========================
           FINAL MESSAGE
        ========================= */

        function showError() {

            running = false;

            clearTimeout(
                flowerTimer
            );


            /*
             * One final giant burst
             * before the message.
             */

            createFlowerBurst(30);


            /*
             * Wait for the final flowers
             * to pop into place.
             */

            setTimeout(
                () => {

                    errorScreen.style.display =
                        "flex";

                },
                1200
            );
        }



        /* =========================
           RESTART
        ========================= */

        function restart() {

            running = false;


            clearTimeout(
                flowerTimer
            );


            /*
             * Remove ALL flowers.
             */

            flowerContainer.innerHTML =
                "";


            flowerCount = 0;

            speed = 900;


            /*
             * Hide error message.
             */

            errorScreen.style.display =
                "none";


            /*
             * Show opening screen again.
             */

            startScreen.classList.remove(
                "hidden"
            );
        }

    </script>

</body>
</html>
